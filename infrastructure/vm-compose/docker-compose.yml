services:
  postgres:
    image: postgres:18.1
    restart: always
    environment:
      POSTGRES_DB: pitlanedb
      POSTGRES_USER: pitlane
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    expose:
      - "5432"

  api:
    image: ghcr.io/pitlanefantasy/pitlane-fantasy-api:v24
    restart: always
    environment:
      DATABASE_URL: postgresql://pitlane:${DB_PASSWORD}@postgres:5432/pitlanedb
      APP_NAME: PitLane Fantasy API
      VERSION: 1.0.0
      SECRET_KEY: ${SECRET_KEY}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
    depends_on:
      - postgres
    expose:
      - "8000"

  frontend:
    image: ghcr.io/pitlanefantasy/pitlane-frontend:v25
    restart: always
    expose:
      - "80"

  edge:
    image: nginx:1.30.2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend

volumes:
  postgres-data:
